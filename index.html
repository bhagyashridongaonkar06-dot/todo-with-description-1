<head>

    <title>Todo with description 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                       <form action="" id="todoForm">
                            <div class="form-group">
                                <label for="todo">Enter todo<span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="todo">
                            </div>
        
                            <div class="form-group">
                                <label for="description">Enter Description<span class="text-danger">*</span></label>
                                <textarea class="form-control" id="description"></textarea>
                            </div>
        
                            <div class="form-group">
                                <label for="isCompleted">Enter Status<span class="text-danger">*</span></label>
                                <select class="form-control" id="isCompleted">
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                </select>
                            </div>
        
                            <button type="submit" class="btn btn-sm btn-primary btn-block" id="addTodo">Add Todo</button>
                            <button type="button" class="btn btn-sm btn-success btn-block d-none" id="updateTodo">Update Todo</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <ul class="list-group" id="todoContainer">
                            <!-- <li class="list-group-item">
                                <div class="d-flex justify-content-between" onclick="showDescription(this)">
                                    <div>
                                        <input type="checkbox" class="p-2" onclick="event.stopPropagation(); onStatusChange(this)">
                                        <strong>todo</strong>
                                    </div>

                                    <div>
                                        <button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); onTodoEdit(this)">Edit</button>
                                        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); onTodoDelete(this)">Delete</button>
                                    </div>
                                </div>

                                <div class="collapse">
                                    <div class="card-body">
                                        Some placeholder content for the first accordion panel. This panel is shown by default, thanks to the <code>.show</code> class.
                                    </div>
                                </div>
                            </li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    
<div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
